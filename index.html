<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DeepSeek 助手</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css" id="hljsLight">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" id="hljsDark" disabled>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #f5f6f8;
    --bg-panel: #fff;
    --bg-bubble-ai: #fff;
    --bg-bubble-user: #4d6bfe;
    --text: #222;
    --text-user: #fff;
    --text-sub: #667;
    --text-meta: #999;
    --border: #e0e0e0;
    --border-soft: #eee;
    --header-bg: #4d6bfe;
    --header-fg: #fff;
    --primary: #4d6bfe;
    --reason-bg: #fff7e0;
    --reason-bd: #ffe0a3;
    --reason-fg: #8a6d1f;
    --reason-body: #6b5518;
    --code-bg: #f6f8fa;
    --stat-bg: #eef1f8;
    --stat-fg: #556;
    --input-bg: #f7f8fa;
    --shadow: rgba(0,0,0,.08);
  }
  body.dark {
    --bg: #1a1b1e;
    --bg-panel: #26272b;
    --bg-bubble-ai: #2b2c31;
    --bg-bubble-user: #4d6bfe;
    --text: #e6e6e8;
    --text-user: #fff;
    --text-sub: #a8aab0;
    --text-meta: #7c7e85;
    --border: #3a3b40;
    --border-soft: #2f3035;
    --header-bg: #202127;
    --header-fg: #e6e6e8;
    --primary: #6b8aff;
    --reason-bg: #332c1a;
    --reason-bd: #554521;
    --reason-fg: #e3c778;
    --reason-body: #d4bd82;
    --code-bg: #16171a;
    --stat-bg: #202127;
    --stat-fg: #a8aab0;
    --input-bg: #2b2c31;
    --shadow: rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    overflow: hidden;
    transition: background .2s, color .2s;
  }
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
