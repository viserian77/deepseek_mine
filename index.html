<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DeepSeek 助手</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css" id="hljsLight">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" id="hljsDark" disabled>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #f5f6f8;
    --bg-panel: #fff;
    --bg-bubble-ai: #fff;
    --bg-bubble-user: #4d6bfe;
    --text: #222;
    --text-user: #fff;
    --text-sub: #667;
    --text-meta: #999;
    --border: #e0e0e0;
    --border-soft: #eee;
    --header-bg: #4d6bfe;
    --header-fg: #fff;
    --primary: #4d6bfe;
    --reason-bg: #fff7e0;
    --reason-bd: #ffe0a3;
    --reason-fg: #8a6d1f;
    --reason-body: #6b5518;
    --code-bg: #f6f8fa;
    --stat-bg: #eef1f8;
    --stat-fg: #556;
    --input-bg: #f7f8fa;
    --shadow: rgba(0,0,0,.08);
  }
  body.dark {
    --bg: #1a1b1e;
    --bg-panel: #26272b;
    --bg-bubble-ai: #2b2c31;
    --bg-bubble-user: #4d6bfe;
    --text: #e6e6e8;
    --text-user: #fff;
    --text-sub: #a8aab0;
    --text-meta: #7c7e85;
    --border: #3a3b40;
    --border-soft: #2f3035;
    --header-bg: #202127;
    --header-fg: #e6e6e8;
    --primary: #6b8aff;
    --reason-bg: #332c1a;
    --reason-bd: #554521;
    --reason-fg: #e3c778;
    --reason-body: #d4bd82;
    --code-bg: #16171a;
    --stat-bg: #202127;
    --stat-fg: #a8aab0;
    --input-bg: #2b2c31;
    --shadow: rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    overflow: hidden;
    transition: background .2s, color .2s;
  }
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }header {
  background: var(--header-bg); color: var(--header-fg);
  padding: 8px 6px;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 15px; font-weight: 600;
  box-shadow: 0 1px 4px var(--shadow);
  z-index: 10; gap: 3px;
}
header .title {
  flex: 1; text-align: center; font-size: 14px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  padding: 0 2px;
}
header button {
  background: rgba(255,255,255,.15); border: none;
  color: inherit; padding: 5px 6px; border-radius: 8px;
  font-size: 12px; white-space: nowrap;
  min-width: 32px;
}
body.dark header button { background: rgba(255,255,255,.08); }
header button:active { opacity: .7; }
#thinkBtn.on { background: #ffd54f; color: #6b4a00; font-weight: 700; }
#scrollBtn.mode-on { background: #4caf50; color: #fff; }
#scrollBtn.mode-off { opacity: .5; }
#chat {
  flex: 1; overflow-y: auto;
  padding: 12px; display: flex;
  flex-direction: column; gap: 6px;
  -webkit-overflow-scrolling: touch;
  position: relative;
}
.block { display: flex; flex-direction: column; max-width: 88%; }
.block.user { align-self: flex-end; align-items: flex-end; }
.block.ai   { align-self: flex-start; align-items: flex-start; }
.msg {
  padding: 10px 14px;
  border-radius: 16px; line-height: 1.55;
  font-size: 15px;
  word-break: break-word;
  animation: fadeIn .2s ease;
  overflow-wrap: anywhere;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.user .msg {
  background: var(--bg-bubble-user); color: var(--text-user);
  border-bottom-right-radius: 5px;
  white-space: pre-wrap;
}
.ai .msg {
  background: var(--bg-bubble-ai); color: var(--text);
  border-bottom-left-radius: 5px;
  box-shadow: 0 1px 3px var(--shadow);
}
.ai .msg.error { background: #ffe9e9; color: #c33; }
.ai .msg p { margin: 0 0 8px; }
.ai .msg p:last-child { margin-bottom: 0; }
.ai .msg h1, .ai .msg h2, .ai .msg h3 { margin: 8px 0 6px; font-size: 1.1em; }
.ai .msg ul, .ai .msg ol { margin: 4px 0; padding-left: 20px; }
.ai .msg li { margin: 2px 0; }
.ai .msg code {
  background: var(--code-bg);
  padding: 1px 5px;
  border-radius: 4px;
  font-size: .9em;
  font-family: ui-monospace, Menlo, monospace;
}
.ai .msg pre {
  background: var(--code-bg);
  padding: 10px 12px;
  border-radius: 8px;
  overflow-x: auto;
  margin: 8px 0;
  border: 1px solid var(--border-soft);
}
.ai .msg pre code { background: none; padding: 0; }
.ai .msg blockquote {
  border-left: 3px solid var(--primary);
  padding-left: 10px; margin: 6px 0;
  color: var(--text-sub);
}
.ai .msg table {
  border-collapse: collapse; margin: 8px 0;
  font-size: 14px; width: 100%;
}
.ai .msg th, .ai .msg td {
  border: 1px solid var(--border);
  padding: 5px 8px;
}
.ai .msg th { background: var(--code-bg); }
.ai .msg a { color: var(--primary); }/* 操作按钮行 */
.actions {
  display: flex; gap: 3px;
  margin: 3px 4px 0;
  opacity: .55;
  transition: opacity .2s;
  flex-wrap: wrap;
}
.block:focus-within .actions { opacity: 1; }
.actBtn {
  background: none; border: none;
  font-size: 12px; padding: 3px 7px;
  border-radius: 6px; color: var(--text-sub);
  line-height: 1.4; cursor: pointer;
  border: 1px solid transparent;
}
.actBtn:active { background: rgba(128,128,128,.15); }
.actBtn.starred { color: #f4b400; font-weight: 600; }
.meta {
  font-size: 11px; color: var(--text-meta);
  margin-top: 2px; padding-left: 6px;
  font-family: ui-monospace, Menlo, monospace;
}
.cursor::after {
  content: "_"; color: var(--primary);
  animation: blink .8s steps(2) infinite;
  margin-left: 2px;
}
@keyframes blink { 50% { opacity: 0; } }
.empty {
  text-align: center; color: var(--text-meta);
  margin: auto; font-size: 14px; line-height: 1.8;
}
.empty b { color: var(--primary); display: block; font-size: 18px; margin-bottom: 8px; }
.reason {
  max-width: 84%; align-self: flex-start;
  background: var(--reason-bg);
  border: 1px solid var(--reason-bd);
  border-radius: 12px;
  padding: 8px 12px;
  font-size: 13px; color: var(--reason-fg);
  margin-bottom: -2px;
}
.reason summary { cursor: pointer; font-weight: 600; outline: none; list-style: none; }
.reason summary::-webkit-details-marker { display: none; }
.reason summary::before { content: "[思考] "; }
.reason summary::after { content: " 展开"; }
.reason[open] summary::after { content: " 收起"; }
.reason .reason-body {
  margin-top: 6px; white-space: pre-wrap;
  word-break: break-word; line-height: 1.6;
  color: var(--reason-body); max-height: 240px; overflow-y: auto;
}
.reason.thinking summary::after {
  content: " ..."; animation: blink .8s steps(2) infinite;
}
#statBar {
  background: var(--stat-bg); color: var(--stat-fg);
  font-size: 11.5px; padding: 5px 12px;
  display: flex; justify-content: space-between;
  align-items: center; border-top: 1px solid var(--border-soft);
  font-family: ui-monospace, Menlo, monospace;
  gap: 8px;
}
#statBar .left { flex: 1; }
#statBar b { color: var(--primary); }
#statBar .cost { color: #d97706; font-weight: 600; }
#statBar .reset {
  background: none; border: 1px solid var(--border);
  color: var(--stat-fg); border-radius: 6px;
  padding: 1px 6px; font-size: 10.5px;
}
.input-area {
  display: flex; padding: 8px 10px;
  background: var(--bg-panel); gap: 8px;
  border-top: 1px solid var(--border-soft);
  padding-bottom: calc(8px + env(safe-area-inset-bottom));
}
#input {
  flex: 1; padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 22px; font-size: 15px;
  outline: none; background: var(--input-bg);
  color: var(--text);
  resize: none; max-height: 120px;
  font-family: inherit;
}
#input:focus { border-color: var(--primary); background: var(--bg-panel); }
#send {
  padding: 0 18px; border: none;
  background: var(--primary); color: #fff;
  border-radius: 22px; font-size: 15px;
  font-weight: 600; min-width: 64px;
}
#send:active { transform: scale(.96); }
#send:disabled { opacity: .4; }
.loading { display: inline-flex; gap: 4px; align-items: center; height: 20px; }
.loading span {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--primary); animation: bounce 1.2s infinite;
}
.loading span:nth-child(2) { animation-delay: .15s; }
.loading span:nth-child(3) { animation-delay: .3s; }
@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: .4; }
  30% { transform: translateY(-5px); opacity: 1; }
}
