<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DeepSeek 助手</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css" id="hljsLight">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" id="hljsDark" disabled>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #f5f6f8;
    --bg-panel: #fff;
    --bg-bubble-ai: #fff;
    --bg-bubble-user: #4d6bfe;
    --text: #222;
    --text-user: #fff;
    --text-sub: #667;
    --text-meta: #999;
    --border: #e0e0e0;
    --border-soft: #eee;
    --header-bg: #4d6bfe;
    --header-fg: #fff;
    --primary: #4d6bfe;
    --reason-bg: #fff7e0;
    --reason-bd: #ffe0a3;
    --reason-fg: #8a6d1f;
    --reason-body: #6b5518;
    --code-bg: #f6f8fa;
    --stat-bg: #eef1f8;
    --stat-fg: #556;
    --input-bg: #f7f8fa;
    --shadow: rgba(0,0,0,.08);
  }
  body.dark {
    --bg: #1a1b1e;
    --bg-panel: #26272b;
    --bg-bubble-ai: #2b2c31;
    --bg-bubble-user: #4d6bfe;
    --text: #e6e6e8;
    --text-user: #fff;
    --text-sub: #a8aab0;
    --text-meta: #7c7e85;
    --border: #3a3b40;
    --border-soft: #2f3035;
    --header-bg: #202127;
    --header-fg: #e6e6e8;
    --primary: #6b8aff;
    --reason-bg: #332c1a;
    --reason-bd: #554521;
    --reason-fg: #e3c778;
    --reason-body: #d4bd82;
    --code-bg: #16171a;
    --stat-bg: #202127;
    --stat-fg: #a8aab0;
    --input-bg: #2b2c31;
    --shadow: rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    overflow: hidden;
    transition: background .2s, color .2s;
  }
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  header {
    background: var(--header-bg); color: var(--header-fg);
    padding: 10px 8px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 15px; font-weight: 600;
    box-shadow: 0 1px 4px var(--shadow);
    z-index: 10; gap: 4px;
  }
  header .title {
    flex: 1; text-align: center; font-size: 14px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding: 0 4px;
  }
  header button {
    background: rgba(255,255,255,.15); border: none;
    color: inherit; padding: 6px 7px; border-radius: 8px;
    font-size: 13px; white-space: nowrap;
  }
  body.dark header button { background: rgba(255,255,255,.08); }
  header button:active { opacity: .7; }
  #thinkBtn.on { background: #ffd54f; color: #6b4a00; font-weight: 700; }
  #quickBar {
    display: flex; gap: 6px;
    padding: 6px 10px;
    overflow-x: auto;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border-soft);
    scrollbar-width: none;
  }
  #quickBar::-webkit-scrollbar { display: none; }
  .qchip {
    flex: none;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-sub);
    padding: 4px 12px;
    border-radius: 14px;
    font-size: 12.5px;
    white-space: nowrap;
  }
  .qchip:active { background: var(--primary); color: #fff; border-color: var(--primary); }
  #chat {
    flex: 1; overflow-y: auto;
    padding: 12px; display: flex;
    flex-direction: column; gap: 6px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  .block { display: flex; flex-direction: column; max-width: 88%; }
  .block.user { align-self: flex-end; align-items: flex-end; }
  .block.ai   { align-self: flex-start; align-items: flex-start; }
  .msg {
    padding: 10px 14px;
    border-radius: 16px; line-height: 1.55;
    font-size: 15px;
    word-break: break-word;
    animation: fadeIn .2s ease;
    overflow-wrap: anywhere;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .user .msg {
    background: var(--bg-bubble-user); color: var(--text-user);
    border-bottom-right-radius: 5px;
    white-space: pre-wrap;
  }
  .ai .msg {
    background: var(--bg-bubble-ai); color: var(--text);
    border-bottom-left-radius: 5px;
    box-shadow: 0 1px 3px var(--shadow);
  }
  .ai .msg.error { background: #ffe9e9; color: #c33; }
  .ai .msg p { margin: 0 0 8px; }
  .ai .msg p:last-child { margin-bottom: 0; }
  .ai .msg h1, .ai .msg h2, .ai .msg h3 { margin: 8px 0 6px; font-size: 1.1em; }
  .ai .msg ul, .ai .msg ol { margin: 4px 0; padding-left: 20px; }
  .ai .msg li { margin: 2px 0; }
  .ai .msg code {
    background: var(--code-bg);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: .9em;
    font-family: ui-monospace, Menlo, monospace;
  }
  .ai .msg pre {
    background: var(--code-bg);
    padding: 10px 12px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 8px 0;
    border: 1px solid var(--border-soft);
  }
  .ai .msg pre code { background: none; padding: 0; }
  .ai .msg blockquote {
    border-left: 3px solid var(--primary);
    padding-left: 10px; margin: 6px 0;
    color: var(--text-sub);
  }
  .ai .msg table {
    border-collapse: collapse; margin: 8px 0;
    font-size: 14px; width: 100%;
  }
  .ai .msg th, .ai .msg td {
    border: 1px solid var(--border);
    padding: 5px 8px;
  }
  .ai .msg th { background: var(--code-bg); }
  .ai .msg a { color: var(--primary); }/* 操作按钮行 */
  .actions {
    display: flex; gap: 3px;
    margin: 3px 4px 0;
    opacity: .55;
    transition: opacity .2s;
  }
  .block:focus-within .actions { opacity: 1; }
  .actBtn {
    background: none; border: none;
    font-size: 13px; padding: 2px 6px;
    border-radius: 6px; color: var(--text-sub);
    line-height: 1.4; cursor: pointer;
  }
  .actBtn:active { background: rgba(128,128,128,.15); }
  .actBtn.starred { color: #f4b400; }
  .meta {
    font-size: 11px; color: var(--text-meta);
    margin-top: 2px; padding-left: 6px;
    font-family: ui-monospace, Menlo, monospace;
  }
  .cursor::after {
    content: "▋"; color: var(--primary);
    animation: blink .8s steps(2) infinite;
    margin-left: 2px;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .empty {
    text-align: center; color: var(--text-meta);
    margin: auto; font-size: 14px; line-height: 1.8;
  }
  .empty b { color: var(--primary); display: block; font-size: 18px; margin-bottom: 8px; }
  .reason {
    max-width: 84%; align-self: flex-start;
    background: var(--reason-bg);
    border: 1px solid var(--reason-bd);
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 13px; color: var(--reason-fg);
    margin-bottom: -2px;
  }
  .reason summary { cursor: pointer; font-weight: 600; outline: none; list-style: none; }
  .reason summary::-webkit-details-marker { display: none; }
  .reason summary::before { content: "🧠 "; }
  .reason summary::after { content: " ▾"; }
  .reason[open] summary::after { content: " ▴"; }
  .reason .reason-body {
    margin-top: 6px; white-space: pre-wrap;
    word-break: break-word; line-height: 1.6;
    color: var(--reason-body); max-height: 240px; overflow-y: auto;
  }
  .reason.thinking summary::after {
    content: " ▋"; animation: blink .8s steps(2) infinite;
  }
  #statBar {
    background: var(--stat-bg); color: var(--stat-fg);
    font-size: 11.5px; padding: 5px 12px;
    display: flex; justify-content: space-between;
    align-items: center; border-top: 1px solid var(--border-soft);
    font-family: ui-monospace, Menlo, monospace;
    gap: 8px;
  }
  #statBar .left { flex: 1; }
  #statBar b { color: var(--primary); }
  #statBar .cost { color: #d97706; font-weight: 600; }
  #statBar .reset {
    background: none; border: 1px solid var(--border);
    color: var(--stat-fg); border-radius: 6px;
    padding: 1px 6px; font-size: 10.5px;
  }
  .input-area {
    display: flex; padding: 8px 10px;
    background: var(--bg-panel); gap: 8px;
    border-top: 1px solid var(--border-soft);
    padding-bottom: calc(8px + env(safe-area-inset-bottom));
  }
  #input {
    flex: 1; padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 22px; font-size: 15px;
    outline: none; background: var(--input-bg);
    color: var(--text);
    resize: none; max-height: 120px;
    font-family: inherit;
  }
  #input:focus { border-color: var(--primary); background: var(--bg-panel); }
  #send {
    padding: 0 18px; border: none;
    background: var(--primary); color: #fff;
    border-radius: 22px; font-size: 15px;
    font-weight: 600; min-width: 64px;
  }
  #send:active { transform: scale(.96); }
  #send:disabled { opacity: .4; }
  .loading { display: inline-flex; gap: 4px; align-items: center; height: 20px; }
  .loading span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--primary); animation: bounce 1.2s infinite;
  }
  .loading span:nth-child(2) { animation-delay: .15s; }
  .loading span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: .4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }
  #toast {
    position: fixed; left: 50%; bottom: 90px;
    transform: translateX(-50%) translateY(20px);
    background: rgba(30,30,40,.92); color: #fff;
    padding: 8px 16px; border-radius: 20px;
    font-size: 13px; opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 9999;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.4);
    z-index: 9998;
    display: none;
  }
  .overlay.show { display: block; }
  .overlay .sheet {
    background: var(--bg-panel); color: var(--text);
    height: 100%; width: 82%; max-width: 340px;
    display: flex; flex-direction: column;
    box-shadow: 2px 0 12px var(--shadow);
  }
  .overlay.right .sheet { margin-left: auto; }
  .overlay.center { display: none; }
  .overlay.center.show { display: flex; align-items: flex-end; }
  .overlay.center .sheet {
    width: 100%; height: auto; max-height: 82vh;
    margin: auto auto 0; margin-left: 0; margin-right: 0;
    border-radius: 16px 16px 0 0;
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
  }
  .sheet h3 {
    margin: 0 0 8px; font-size: 15px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 4px 8px;
    border-bottom: 1px solid var(--border-soft);
  }
  .sheet h3 button {
    background: none; border: none; font-size: 14px; color: var(--text-sub);
  }
  .sheet .body { flex: 1; overflow-y: auto; padding: 4px 0; }
  .sessItem {
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    margin: 2px 4px;
    display: flex; align-items: center; gap: 6px;
    cursor: pointer;
  }
  .sessItem.active { background: rgba(77,107,254,.12); }
  .sessItem .s-title {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sessItem .s-time { font-size: 10.5px; color: var(--text-meta); }
  .sessItem .s-op {
    background: none; border: none; color: var(--text-sub);
    font-size: 14px; padding: 2px 4px;
  }
  .sessItem input {
    flex: 1; border: 1px solid var(--primary);
    background: var(--bg); color: var(--text);
    padding: 4px 6px; border-radius: 6px;
    font-size: 13px; outline: none;
  }
  #newSessBtn {
    margin: 6px 8px 10px;
    background: var(--primary); color: #fff;
    border: none; padding: 10px;
    border-radius: 10px; font-size: 14px; font-weight: 600;
  }
  .favItem {
    border-bottom: 1px solid var(--border-soft);
    padding: 10px 6px; font-size: 14px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .favItem .role { font-size: 11px; color: var(--primary); font-weight: 600; }
  .favItem .role.ai { color: var(--text-meta); }
  .favItem .text { white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
  .favItem .ops { display: flex; gap: 8px; }
  .favItem .ops button {
    background: none; border: 1px solid var(--border);
    color: var(--text-sub);
    padding: 2px 8px; border-radius: 6px; font-size: 12px;
  }
  .favEmpty { text-align: center; color: var(--text-meta); padding: 30px 0; font-size: 13px; }
  .branchChoice {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 10000;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .branchChoice .box {
    background: var(--bg-panel); color: var(--text);
    border-radius: 14px; padding: 18px;
    max-width: 340px; width: 100%;
  }
  .branchChoice h4 { margin: 0 0 8px; font-size: 15px; }
  .branchChoice p { margin: 0 0 14px; font-size: 13px; color: var(--text-sub); line-height: 1.5; }
  .branchChoice button {
    display: block; width: 100%;
    padding: 10px; margin-bottom: 6px;
    border-radius: 10px; border: none;
    font-size: 14px;
  }
  .branchChoice .b1 { background: var(--primary); color: #fff; }
  .branchChoice .b2 { background: var(--code-bg); color: var(--text); }
  .branchChoice .bcancel { background: none; color: var(--text-sub); }
</style>
</head>
<body>

<header>
  <button id="menuBtn">☰</button>
  <div class="title" id="sessTitle">新对话</div>
  <button id="thinkBtn">🧠</button>
  <button id="favBtn">⭐</button>
  <button id="darkBtn">🌙</button>
  <button id="settings">⚙️</button>
</header>

<div id="quickBar"></div>

<div id="chat">
  <div class="empty" id="empty">
    <b>👋 你好</b>
    有什么可以帮你的吗？<br>
    <span style="font-size:12px;opacity:.6">点右上角 🧠 开启深度思考</span>
  </div>
</div>

<div id="statBar">
  <span class="left">
    本次：<b id="curTokens">0</b> · 累计：<b id="totalTokens">0</b> tokens ·
    <span class="cost">≈¥<span id="totalCost">0.0000</span></span>
  </span>
  <button class="reset" id="resetStat">重置</button>
</div>

<div class="input-area">
  <textarea id="input" rows="1" placeholder="输入消息..." autocomplete="off"></textarea>
  <button id="send">发送</button>
</div>

<div class="overlay" id="sessPanel">
  <div class="sheet">
    <h3><span>💬 会话</span><button id="closeSess">关闭</button></h3>
    <button id="newSessBtn">＋ 新建对话</button>
    <div class="body" id="sessList"></div>
  </div>
</div>

<div class="overlay center" id="favPanel">
  <div class="sheet">
    <h3><span>⭐ 我的收藏</span><button id="closeFav">关闭</button></h3>
    <div class="body" id="favList"></div>
  </div>
</div>

<div id="toast"></div>

<script>
