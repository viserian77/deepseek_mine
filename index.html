<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DeepSeek 助手</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css" id="hljsLight">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" id="hljsDark" disabled>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #f5f6f8;
    --bg-panel: #fff;
    --bg-bubble-ai: #fff;
    --bg-bubble-user: #4d6bfe;
    --text: #222;
    --text-user: #fff;
    --text-sub: #667;
    --text-meta: #999;
    --border: #e0e0e0;
    --border-soft: #eee;
    --header-bg: #4d6bfe;
    --header-fg: #fff;
    --primary: #4d6bfe;
    --reason-bg: #fff7e0;
    --reason-bd: #ffe0a3;
    --reason-fg: #8a6d1f;
    --reason-body: #6b5518;
    --code-bg: #f6f8fa;
    --stat-bg: #eef1f8;
    --stat-fg: #556;
    --input-bg: #f7f8fa;
    --shadow: rgba(0,0,0,.08);
  }
  body.dark {
    --bg: #1a1b1e;
    --bg-panel: #26272b;
    --bg-bubble-ai: #2b2c31;
    --bg-bubble-user: #4d6bfe;
    --text: #e6e6e8;
    --text-user: #fff;
    --text-sub: #a8aab0;
    --text-meta: #7c7e85;
    --border: #3a3b40;
    --border-soft: #2f3035;
    --header-bg: #202127;
    --header-fg: #e6e6e8;
    --primary: #6b8aff;
    --reason-bg: #332c1a;
    --reason-bd: #554521;
    --reason-fg: #e3c778;
    --reason-body: #d4bd82;
    --code-bg: #16171a;
    --stat-bg: #202127;
    --stat-fg: #a8aab0;
    --input-bg: #2b2c31;
    --shadow: rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    overflow: hidden;
    transition: background .2s, color .2s;
  }
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  header {
    background: var(--header-bg); color: var(--header-fg);
    padding: 10px 8px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 15px; font-weight: 600;
    box-shadow: 0 1px 4px var(--shadow);
    z-index: 10; gap: 4px;
  }
  header .title {
    flex: 1; text-align: center; font-size: 14px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding: 0 4px;
  }
  header button {
    background: rgba(255,255,255,.15); border: none;
    color: inherit; padding: 6px 7px; border-radius: 8px;
    font-size: 13px; white-space: nowrap;
  }
  body.dark header button { background: rgba(255,255,255,.08); }
  header button:active { opacity: .7; }
  #thinkBtn.on { background: #ffd54f; color: #6b4a00; font-weight: 700; }
  #quickBar {
    display: flex; gap: 6px;
    padding: 6px 10px;
    overflow-x: auto;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border-soft);
    scrollbar-width: none;
  }
  #quickBar::-webkit-scrollbar { display: none; }
  .qchip {
    flex: none;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-sub);
    padding: 4px 12px;
    border-radius: 14px;
    font-size: 12.5px;
    white-space: nowrap;
  }
  .qchip:active { background: var(--primary); color: #fff; border-color: var(--primary); }
  #chat {
    flex: 1; overflow-y: auto;
    padding: 12px; display: flex;
    flex-direction: column; gap: 6px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  .block { display: flex; flex-direction: column; max-width: 88%; }
  .block.user { align-self: flex-end; align-items: flex-end; }
  .block.ai   { align-self: flex-start; align-items: flex-start; }
  .msg {
    padding: 10px 14px;
    border-radius: 16px; line-height: 1.55;
    font-size: 15px;
    word-break: break-word;
    animation: fadeIn .2s ease;
    overflow-wrap: anywhere;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .user .msg {
    background: var(--bg-bubble-user); color: var(--text-user);
    border-bottom-right-radius: 5px;
    white-space: pre-wrap;
  }
  .ai .msg {
    background: var(--bg-bubble-ai); color: var(--text);
    border-bottom-left-radius: 5px;
    box-shadow: 0 1px 3px var(--shadow);
  }
  .ai .msg.error { background: #ffe9e9; color: #c33; }
  .ai .msg p { margin: 0 0 8px; }
  .ai .msg p:last-child { margin-bottom: 0; }
  .ai .msg h1, .ai .msg h2, .ai .msg h3 { margin: 8px 0 6px; font-size: 1.1em; }
  .ai .msg ul, .ai .msg ol { margin: 4px 0; padding-left: 20px; }
  .ai .msg li { margin: 2px 0; }
  .ai .msg code {
    background: var(--code-bg);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: .9em;
    font-family: ui-monospace, Menlo, monospace;
  }
  .ai .msg pre {
    background: var(--code-bg);
    padding: 10px 12px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 8px 0;
    border: 1px solid var(--border-soft);
  }
  .ai .msg pre code { background: none; padding: 0; }
  .ai .msg blockquote {
    border-left: 3px solid var(--primary);
    padding-left: 10px; margin: 6px 0;
    color: var(--text-sub);
  }
  .ai .msg table {
    border-collapse: collapse; margin: 8px 0;
    font-size: 14px; width: 100%;
  }
  .ai .msg th, .ai .msg td {
    border: 1px solid var(--border);
    padding: 5px 8px;
  }
  .ai .msg th { background: var(--code-bg); }
  .ai .msg a { color: var(--primary); }/* 操作按钮行 */
  .actions {
    display: flex; gap: 3px;
    margin: 3px 4px 0;
    opacity: .55;
    transition: opacity .2s;
  }
  .block:focus-within .actions { opacity: 1; }
  .actBtn {
    background: none; border: none;
    font-size: 13px; padding: 2px 6px;
    border-radius: 6px; color: var(--text-sub);
    line-height: 1.4; cursor: pointer;
  }
  .actBtn:active { background: rgba(128,128,128,.15); }
  .actBtn.starred { color: #f4b400; }
  .meta {
    font-size: 11px; color: var(--text-meta);
    margin-top: 2px; padding-left: 6px;
    font-family: ui-monospace, Menlo, monospace;
  }
  .cursor::after {
    content: "▋"; color: var(--primary);
    animation: blink .8s steps(2) infinite;
    margin-left: 2px;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .empty {
    text-align: center; color: var(--text-meta);
    margin: auto; font-size: 14px; line-height: 1.8;
  }
  .empty b { color: var(--primary); display: block; font-size: 18px; margin-bottom: 8px; }
  .reason {
    max-width: 84%; align-self: flex-start;
    background: var(--reason-bg);
    border: 1px solid var(--reason-bd);
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 13px; color: var(--reason-fg);
    margin-bottom: -2px;
  }
  .reason summary { cursor: pointer; font-weight: 600; outline: none; list-style: none; }
  .reason summary::-webkit-details-marker { display: none; }
  .reason summary::before { content: "🧠 "; }
  .reason summary::after { content: " ▾"; }
  .reason[open] summary::after { content: " ▴"; }
  .reason .reason-body {
    margin-top: 6px; white-space: pre-wrap;
    word-break: break-word; line-height: 1.6;
    color: var(--reason-body); max-height: 240px; overflow-y: auto;
  }
  .reason.thinking summary::after {
    content: " ▋"; animation: blink .8s steps(2) infinite;
  }
  #statBar {
    background: var(--stat-bg); color: var(--stat-fg);
    font-size: 11.5px; padding: 5px 12px;
    display: flex; justify-content: space-between;
    align-items: center; border-top: 1px solid var(--border-soft);
    font-family: ui-monospace, Menlo, monospace;
    gap: 8px;
  }
  #statBar .left { flex: 1; }
  #statBar b { color: var(--primary); }
  #statBar .cost { color: #d97706; font-weight: 600; }
  #statBar .reset {
    background: none; border: 1px solid var(--border);
    color: var(--stat-fg); border-radius: 6px;
    padding: 1px 6px; font-size: 10.5px;
  }
  .input-area {
    display: flex; padding: 8px 10px;
    background: var(--bg-panel); gap: 8px;
    border-top: 1px solid var(--border-soft);
    padding-bottom: calc(8px + env(safe-area-inset-bottom));
  }
  #input {
    flex: 1; padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 22px; font-size: 15px;
    outline: none; background: var(--input-bg);
    color: var(--text);
    resize: none; max-height: 120px;
    font-family: inherit;
  }
  #input:focus { border-color: var(--primary); background: var(--bg-panel); }
  #send {
    padding: 0 18px; border: none;
    background: var(--primary); color: #fff;
    border-radius: 22px; font-size: 15px;
    font-weight: 600; min-width: 64px;
  }
  #send:active { transform: scale(.96); }
  #send:disabled { opacity: .4; }
  .loading { display: inline-flex; gap: 4px; align-items: center; height: 20px; }
  .loading span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--primary); animation: bounce 1.2s infinite;
  }
  .loading span:nth-child(2) { animation-delay: .15s; }
  .loading span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: .4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }
  #toast {
    position: fixed; left: 50%; bottom: 90px;
    transform: translateX(-50%) translateY(20px);
    background: rgba(30,30,40,.92); color: #fff;
    padding: 8px 16px; border-radius: 20px;
    font-size: 13px; opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 9999;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.4);
    z-index: 9998;
    display: none;
  }
  .overlay.show { display: block; }
  .overlay .sheet {
    background: var(--bg-panel); color: var(--text);
    height: 100%; width: 82%; max-width: 340px;
    display: flex; flex-direction: column;
    box-shadow: 2px 0 12px var(--shadow);
  }
  .overlay.right .sheet { margin-left: auto; }
  .overlay.center { display: none; }
  .overlay.center.show { display: flex; align-items: flex-end; }
  .overlay.center .sheet {
    width: 100%; height: auto; max-height: 82vh;
    margin: auto auto 0; margin-left: 0; margin-right: 0;
    border-radius: 16px 16px 0 0;
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
  }
  .sheet h3 {
    margin: 0 0 8px; font-size: 15px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 4px 8px;
    border-bottom: 1px solid var(--border-soft);
  }
  .sheet h3 button {
    background: none; border: none; font-size: 14px; color: var(--text-sub);
  }
  .sheet .body { flex: 1; overflow-y: auto; padding: 4px 0; }
  .sessItem {
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    margin: 2px 4px;
    display: flex; align-items: center; gap: 6px;
    cursor: pointer;
  }
  .sessItem.active { background: rgba(77,107,254,.12); }
  .sessItem .s-title {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sessItem .s-time { font-size: 10.5px; color: var(--text-meta); }
  .sessItem .s-op {
    background: none; border: none; color: var(--text-sub);
    font-size: 14px; padding: 2px 4px;
  }
  .sessItem input {
    flex: 1; border: 1px solid var(--primary);
    background: var(--bg); color: var(--text);
    padding: 4px 6px; border-radius: 6px;
    font-size: 13px; outline: none;
  }
  #newSessBtn {
    margin: 6px 8px 10px;
    background: var(--primary); color: #fff;
    border: none; padding: 10px;
    border-radius: 10px; font-size: 14px; font-weight: 600;
  }
  .favItem {
    border-bottom: 1px solid var(--border-soft);
    padding: 10px 6px; font-size: 14px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .favItem .role { font-size: 11px; color: var(--primary); font-weight: 600; }
  .favItem .role.ai { color: var(--text-meta); }
  .favItem .text { white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
  .favItem .ops { display: flex; gap: 8px; }
  .favItem .ops button {
    background: none; border: 1px solid var(--border);
    color: var(--text-sub);
    padding: 2px 8px; border-radius: 6px; font-size: 12px;
  }
  .favEmpty { text-align: center; color: var(--text-meta); padding: 30px 0; font-size: 13px; }
  .branchChoice {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 10000;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .branchChoice .box {
    background: var(--bg-panel); color: var(--text);
    border-radius: 14px; padding: 18px;
    max-width: 340px; width: 100%;
  }
  .branchChoice h4 { margin: 0 0 8px; font-size: 15px; }
  .branchChoice p { margin: 0 0 14px; font-size: 13px; color: var(--text-sub); line-height: 1.5; }
  .branchChoice button {
    display: block; width: 100%;
    padding: 10px; margin-bottom: 6px;
    border-radius: 10px; border: none;
    font-size: 14px;
  }
  .branchChoice .b1 { background: var(--primary); color: #fff; }
  .branchChoice .b2 { background: var(--code-bg); color: var(--text); }
  .branchChoice .bcancel { background: none; color: var(--text-sub); }
</style>
</head>
<body>

<header>
  <button id="menuBtn">☰</button>
  <div class="title" id="sessTitle">新对话</div>
  <button id="thinkBtn">🧠</button>
  <button id="favBtn">⭐</button>
  <button id="darkBtn">🌙</button>
  <button id="settings">⚙️</button>
</header>

<div id="quickBar"></div>

<div id="chat">
  <div class="empty" id="empty">
    <b>👋 你好</b>
    有什么可以帮你的吗？<br>
    <span style="font-size:12px;opacity:.6">点右上角 🧠 开启深度思考</span>
  </div>
</div>

<div id="statBar">
  <span class="left">
    本次：<b id="curTokens">0</b> · 累计：<b id="totalTokens">0</b> tokens ·
    <span class="cost">≈¥<span id="totalCost">0.0000</span></span>
  </span>
  <button class="reset" id="resetStat">重置</button>
</div>

<div class="input-area">
  <textarea id="input" rows="1" placeholder="输入消息..." autocomplete="off"></textarea>
  <button id="send">发送</button>
</div>

<div class="overlay" id="sessPanel">
  <div class="sheet">
    <h3><span>💬 会话</span><button id="closeSess">关闭</button></h3>
    <button id="newSessBtn">＋ 新建对话</button>
    <div class="body" id="sessList"></div>
  </div>
</div>

<div class="overlay center" id="favPanel">
  <div class="sheet">
    <h3><span>⭐ 我的收藏</span><button id="closeFav">关闭</button></h3>
    <div class="body" id="favList"></div>
  </div>
</div>

<div id="toast"></div>

<script>/* ============================================================
   基础配置
   ============================================================ */
const API_URL  = "https://api.deepseek.com/chat/completions";
const CHAT_MODEL     = "deepseek-chat";
const REASONER_MODEL = "deepseek-reasoner";
const MAX_HISTORY = 20;
const SESS_KEY   = "ds_sessions_v2";
const THINK_KEY  = "ds_think";
const DARK_KEY   = "ds_dark";
const STAT_KEY   = "ds_stat_v1";
const FAV_KEY    = "ds_fav_v1";
const MSG_PREFIX = "ds_msg_";
const PRICE = {
  "deepseek-chat":     { in: 2,  out: 8  },
  "deepseek-reasoner": { in: 4,  out: 16 }
};
const QUICK_PROMPTS = [
  { label: "🌐 翻译", text: "请把下面的内容翻译成英文：\n" },
  { label: "📝 总结", text: "请总结以下内容的关键点：\n" },
  { label: "💻 写代码", text: "请用 Python 实现以下需求：\n" },
  { label: "✨ 润色", text: "请帮我润色以下文字，让它更流畅自然：\n" },
  { label: "📖 解释", text: "请通俗易懂地解释：\n" },
  { label: "🎓 出题", text: "请根据以下内容出 5 道选择题（附答案）：\n" },
  { label: "🐛 排错", text: "帮我分析这段代码的问题：\n" }
];
marked.setOptions({
  breaks: true,
  gfm: true,
  highlight: function(code, lang) {
    try {
      if (lang && hljs.getLanguage(lang)) {
        return hljs.highlight(code, { language: lang }).value;
      }
      return hljs.highlightAuto(code).value;
    } catch (e) { return code; }
  }
});
function renderMarkdown(text) {
  try {
    const html = marked.parse(text);
    return DOMPurify.sanitize(html, { ADD_ATTR: ["target", "rel"] });
  } catch (e) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }
}
let sessions = [];
let curSessionId = null;
let messages = [];
let isStreaming = false;
let abortController = null;
let useReasoner = localStorage.getItem(THINK_KEY) === "1";
let stat = { totalTokens: 0, totalCost: 0, reqCount: 0 };
let favorites = [];
try { const s = JSON.parse(localStorage.getItem(STAT_KEY)); if (s) stat = Object.assign(stat, s); } catch (e) {}
try { const f = JSON.parse(localStorage.getItem(FAV_KEY));  if (Array.isArray(f)) favorites = f; } catch (e) {}
let uidSeed = Date.now();
function newUid() { return "m" + (++uidSeed); }
function newSessId() { return "s" + Date.now() + Math.floor(Math.random()*1000); }
const chatEl   = document.getElementById("chat");
const inputEl  = document.getElementById("input");
const sendBtn  = document.getElementById("send");
const emptyEl  = document.getElementById("empty");
const sessTitleEl = document.getElementById("sessTitle");
const thinkBtn = document.getElementById("thinkBtn");
const favBtn   = document.getElementById("favBtn");
const darkBtn  = document.getElementById("darkBtn");
const settingsBtn = document.getElementById("settings");
const menuBtn  = document.getElementById("menuBtn");
const curTokensEl   = document.getElementById("curTokens");
const totalTokensEl = document.getElementById("totalTokens");
const totalCostEl   = document.getElementById("totalCost");
const resetStatBtn  = document.getElementById("resetStat");
const toastEl  = document.getElementById("toast");
const quickBar = document.getElementById("quickBar");
const sessPanel = document.getElementById("sessPanel");
const sessList  = document.getElementById("sessList");
const closeSess = document.getElementById("closeSess");
const newSessBtn = document.getElementById("newSessBtn");
const favPanel = document.getElementById("favPanel");
const favList  = document.getElementById("favList");
const closeFav = document.getElementById("closeFav");
let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1500);
}
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast("已复制 ✅");
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("已复制 ✅"); }
    catch (_) { toast("复制失败"); }
    ta.remove();
  }
}
function applyDark() {
  const dark = localStorage.getItem(DARK_KEY) === "1";
  document.body.classList.toggle("dark", dark);
  document.getElementById("hljsLight").disabled = dark;
  document.getElementById("hljsDark").disabled = !dark;
  darkBtn.textContent = dark ? "☀️" : "🌙";
}
darkBtn.addEventListener("click", () => {
  const cur = localStorage.getItem(DARK_KEY) === "1";
  localStorage.setItem(DARK_KEY, cur ? "0" : "1");
  applyDark();
});
applyDark();
function saveStat() { try { localStorage.setItem(STAT_KEY, JSON.stringify(stat)); } catch (e) {} }
function updateStatUI(curTokens) {
  curTokensEl.textContent = curTokens != null ? curTokens : "0";
  totalTokensEl.textContent = stat.totalTokens;
  totalCostEl.textContent = stat.totalCost.toFixed(4);
}
function calcCost(usage, model) {
  const p = PRICE[model] || PRICE["deepseek-chat"];
  const inTok  = usage.prompt_tokens || 0;
  const outTok = usage.completion_tokens || 0;
  return (inTok * p.in + outTok * p.out) / 1_000_000;
}
function getApiKey() {
  let key = localStorage.getItem("ds_key");
  if (!key) {
    key = prompt("请输入你的 DeepSeek API Key（sk-...）\n\n可前往 platform.deepseek.com 获取");
    if (key) { key = key.trim(); localStorage.setItem("ds_key", key); }
  }
  return key;
}
function saveFav() { try { localStorage.setItem(FAV_KEY, JSON.stringify(favorites)); } catch (e) {} }
function isFaved(uid) { return favorites.some(f => f.uid === uid); }
function toggleFav(uid, role, content) {
  const idx = favorites.findIndex(f => f.uid === uid);
  if (idx >= 0) { favorites.splice(idx, 1); toast("已取消收藏"); }
  else { favorites.push({ uid, role, content, time: Date.now() }); toast("已收藏 ⭐"); }
  saveFav();
  document.querySelectorAll(`.actions[data-uid="${uid}"] .favStar`)
    .forEach(b => {
      b.textContent = isFaved(uid) ? "⭐" : "☆";
      b.classList.toggle("starred", isFaved(uid));
    });
}
function loadSessions() {
  try {
    const raw = JSON.parse(localStorage.getItem(SESS_KEY));
    if (raw && Array.isArray(raw.list)) {
      sessions = raw.list;
      curSessionId = raw.curId;
    }
  } catch (e) {}
  if (!sessions.length) createSession(true);
  else if (!sessions.find(s => s.id === curSessionId)) curSessionId = sessions[0].id;
  loadMessagesForCur();
}
function saveSessions() {
  try { localStorage.setItem(SESS_KEY, JSON.stringify({ list: sessions, curId: curSessionId })); } catch (e) {}
}
function saveMessagesForCur() {
  if (!curSessionId) return;
  try { localStorage.setItem(MSG_PREFIX + curSessionId, JSON.stringify(messages)); } catch (e) {}
}
function loadMessagesForCur() {
  messages = [];
  if (!curSessionId) return;
  try {
    const raw = localStorage.getItem(MSG_PREFIX + curSessionId);
    if (raw) {
      const arr = JSON.parse(raw);
      if (Array.isArray(arr)) {
        arr.forEach(m => { if (!m.uid) m.uid = newUid(); });
        messages = arr;
      }
    }
  } catch (e) {}
  renderAll();
  updateSessTitleUI();
}
function createSession(silent) {
  const id = newSessId();
  sessions.unshift({ id, title: "新对话", time: Date.now() });
  curSessionId = id;
  messages = [];
  saveSessions();
  saveMessagesForCur();
  if (!silent) { renderAll(); updateSessTitleUI(); renderSessList(); }
}
function switchSession(id) {
  if (isStreaming) {
    if (!confirm("正在生成，切换会话会中断，确定吗？")) return;
    abortController?.abort();
  }
  saveMessagesForCur();
  curSessionId = id;
  saveSessions();
  loadMessagesForCur();
  renderSessList();
  closeSessPanel();
}
function deleteSession(id) {
  if (!confirm("确定删除这个会话吗？")) return;
  sessions = sessions.filter(s => s.id !== id);
  try { localStorage.removeItem(MSG_PREFIX + id); } catch (e) {}
  if (curSessionId === id) {
    if (sessions.length) curSessionId = sessions[0].id;
    else createSession(true);
    loadMessagesForCur();
  }
  saveSessions();
  renderSessList();
}
function renameSession(id) {
  const s = sessions.find(x => x.id === id);
  if (!s) return;
  const newTitle = prompt("重命名会话：", s.title);
  if (newTitle === null) return;
  const t = newTitle.trim();
  if (!t) return;
  s.title = t.slice(0, 30);
  saveSessions();
  renderSessList();
  if (id === curSessionId) updateSessTitleUI();
}
function updateSessTitleUI() {
  const s = sessions.find(x => x.id === curSessionId);
  sessTitleEl.textContent = s ? s.title : "DeepSeek 助手";
}
function maybeAutoTitle() {
  const s = sessions.find(x => x.id === curSessionId);
  if (!s) return;
  if (s.title && s.title !== "新对话") return;
  const firstUser = messages.find(m => m.role === "user");
  if (!firstUser) return;
  s.title = firstUser.content.slice(0, 20).replace(/\n/g, " ") + (firstUser.content.length > 20 ? "…" : "");
  s.time = Date.now();
  saveSessions();
  updateSessTitleUI();
}
function renderSessList() {
  sessList.innerHTML = "";
  sessions.forEach(s => {
    const item = document.createElement("div");
    item.className = "sessItem" + (s.id === curSessionId ? " active" : "");
    const time = new Date(s.time || Date.now());
    const timeStr = `${time.getMonth()+1}/${time.getDate()} ${String(time.getHours()).padStart(2,'0')}:${String(time.getMinutes()).padStart(2,'0')}`;
    item.innerHTML = `
      <div class="s-title"></div>
      <div class="s-time">${timeStr}</div>
      <button class="s-op" data-op="rename" title="重命名">✏️</button>
      <button class="s-op" data-op="del" title="删除">🗑️</button>
    `;
    item.querySelector(".s-title").textContent = s.title;
    item.addEventListener("click", (e) => {
      if (e.target.dataset.op) return;
      switchSession(s.id);
    });
    item.querySelector('[data-op="rename"]').onclick = (e) => { e.stopPropagation(); renameSession(s.id); };
    item.querySelector('[data-op="del"]').onclick = (e) => { e.stopPropagation(); deleteSession(s.id); };
    sessList.appendChild(item);
  });
}
menuBtn.addEventListener("click", () => { renderSessList(); sessPanel.classList.add("show"); });
function closeSessPanel() { sessPanel.classList.remove("show"); }
closeSess.addEventListener("click", closeSessPanel);
sessPanel.addEventListener("click", (e) => { if (e.target === sessPanel) closeSessPanel(); });
newSessBtn.addEventListener("click", () => {
  if (messages.length && !confirm("新建对话会关闭当前会话，确定吗？")) return;
  saveMessagesForCur();
  createSession(false);
  renderSessList();
  closeSessPanel();
});/* ============================================================
   渲染
   ============================================================ */
function scrollToBottom() { chatEl.scrollTop = chatEl.scrollHeight; }
function buildBlock(m) {
  const block = document.createElement("div");
  block.className = "block " + (m.role === "user" ? "user" : "ai");
  block.dataset.uid = m.uid || (m.uid = newUid());
  const bubble = document.createElement("div");
  bubble.className = "msg " + (m.role === "user" ? "user" : "ai");
  if (m.role === "user") bubble.textContent = m.content;
  else bubble.innerHTML = renderMarkdown(m.content);
  block.appendChild(bubble);
  if (m.role === "assistant" && m.tokens != null) {
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.innerHTML = `${m.chars || 0} 字 · ${m.tokens} tokens` + (m.cost ? ` · ≈¥${m.cost.toFixed(4)}` : "");
    block.appendChild(meta);
  }
  const actions = document.createElement("div");
  actions.className = "actions";
  actions.dataset.uid = block.dataset.uid;
  const btnCopy = document.createElement("button");
  btnCopy.className = "actBtn"; btnCopy.textContent = "📋"; btnCopy.title = "复制";
  btnCopy.onclick = () => copyText(m.content);
  actions.appendChild(btnCopy);
  const btnFav = document.createElement("button");
  btnFav.className = "actBtn favStar" + (isFaved(m.uid) ? " starred" : "");
  btnFav.textContent = isFaved(m.uid) ? "⭐" : "☆";
  btnFav.title = "收藏";
  btnFav.onclick = () => toggleFav(m.uid, m.role, m.content);
  actions.appendChild(btnFav);
  if (m.role === "user") {
    const btnEdit = document.createElement("button");
    btnEdit.className = "actBtn"; btnEdit.textContent = "✏️"; btnEdit.title = "修改";
    btnEdit.onclick = () => editMessage(m.uid);
    actions.appendChild(btnEdit);
    const btnDel = document.createElement("button");
    btnDel.className = "actBtn"; btnDel.textContent = "🗑️"; btnDel.title = "删除";
    btnDel.onclick = () => deleteMessage(m.uid);
    actions.appendChild(btnDel);
  }
  if (m.role === "assistant") {
    const btnRegen = document.createElement("button");
    btnRegen.className = "actBtn"; btnRegen.textContent = "🔄"; btnRegen.title = "重新生成";
    btnRegen.onclick = () => regenerate(m.uid);
    actions.appendChild(btnRegen);
    const btnDel = document.createElement("button");
    btnDel.className = "actBtn"; btnDel.textContent = "🗑️"; btnDel.title = "删除";
    btnDel.onclick = () => deleteMessage(m.uid);
    actions.appendChild(btnDel);
  }
  block.appendChild(actions);
  return block;
}
function renderAll() {
  chatEl.innerHTML = "";
  if (!messages.length) {
    chatEl.appendChild(emptyEl);
    emptyEl.style.display = "block";
    return;
  }
  for (const m of messages) {
    if (m.role === "system") continue;
    if (m.role === "assistant" && m.reasoning) {
      const r = document.createElement("details");
      r.className = "reason";
      r.innerHTML = `<summary>思考过程</summary><div class="reason-body"></div>`;
      r.querySelector(".reason-body").textContent = m.reasoning;
      chatEl.appendChild(r);
    }
    chatEl.appendChild(buildBlock(m));
  }
  scrollToBottom();
}
function askBranchChoice() {
  return new Promise((resolve) => {
    const wrap = document.createElement("div");
    wrap.className = "branchChoice";
    wrap.innerHTML = `
      <div class="box">
        <h4>✏️ 修改这条消息</h4>
        <p>选择处理方式：</p>
        <button class="b1" data-op="overwrite">覆盖后续对话（省 token）</button>
        <button class="b2" data-op="branch">开新分支（保留原对话）</button>
        <button class="bcancel" data-op="cancel">取消</button>
      </div>
    `;
    document.body.appendChild(wrap);
    wrap.addEventListener("click", (e) => {
      const op = e.target.dataset.op;
      if (!op) return;
      wrap.remove();
      if (op === "cancel") resolve(null);
      else resolve(op);
    });
  });
}
let pendingBranchFrom = null;
async function editMessage(uid) {
  if (isStreaming) return alert("正在生成中，稍后再试");
  const idx = messages.findIndex(m => m.uid === uid);
  if (idx < 0) return;
  const m = messages[idx];
  const choice = await askBranchChoice();
  if (!choice) return;
  inputEl.value = m.content;
  inputEl.focus();
  inputEl.dispatchEvent(new Event("input"));
  if (choice === "overwrite") messages = messages.slice(0, idx);
  else { pendingBranchFrom = uid; toast("已进入分支模式，修改后发送将创建新分支"); }
  saveMessagesForCur();
  renderAll();
}
function deleteMessage(uid) {
  if (isStreaming) return alert("正在生成中，稍后再试");
  const idx = messages.findIndex(m => m.uid === uid);
  if (idx < 0) return;
  const m = messages[idx];
  if (!confirm("确定删除这条消息吗？")) return;
  if (m.role === "user") {
    const next = messages[idx + 1];
    if (next && next.role === "assistant") messages.splice(idx, 2);
    else messages.splice(idx, 1);
  } else messages.splice(idx, 1);
  saveMessagesForCur();
  renderAll();
  toast("已删除");
}
async function regenerate(uid) {
  if (isStreaming) return;
  const idx = messages.findIndex(m => m.uid === uid);
  if (idx < 0) return;
  let userIdx = idx - 1;
  while (userIdx >= 0 && messages[userIdx].role !== "user") userIdx--;
  if (userIdx < 0) return alert("找不到对应的提问");
  const userText = messages[userIdx].content;
  if (!confirm("重新生成会再次消耗 token，确定吗？")) return;
  messages = messages.slice(0, userIdx + 1);
  saveMessagesForCur();
  renderAll();
  await doSend(userText, true);
}
async function send() {
  if (isStreaming) return;
  const text = inputEl.value.trim();
  if (!text) return;
  await doSend(text, false);
}
async function doSend(text, skipUserBubble) {
  const key = getApiKey();
  if (!key) return alert("请先配置 API Key");
  if (!skipUserBubble) {
    inputEl.value = "";
    inputEl.style.height = "auto";
    const parentUid = pendingBranchFrom;
    pendingBranchFrom = null;
    const um = { role: "user", content: text, uid: newUid() };
    if (parentUid) um.parentUid = parentUid;
    messages.push(um);
    chatEl.appendChild(buildBlock(um));
    if (emptyEl.parentNode === chatEl) emptyEl.style.display = "none";
    scrollToBottom();
    maybeAutoTitle();
  }
  sendBtn.disabled = true;
  isStreaming = true;
  updateStatUI(0);
  const trimmed = [
    { role: "system", content: "你是一个乐于助人的中文助手，回答简洁明了，使用 Markdown 格式。" },
    ...messages.slice(-MAX_HISTORY).map(m => ({ role: m.role, content: m.content }))
  ];
  const model = useReasoner ? REASONER_MODEL : CHAT_MODEL;
  const isReasoner = useReasoner;
  let reasonBox = null;
  if (isReasoner) {
    if (emptyEl.parentNode === chatEl) emptyEl.style.display = "none";
    const details = document.createElement("details");
    details.className = "reason thinking";
    details.open = true;
    details.innerHTML = `<summary>深度思考中...</summary><div class="reason-body"></div>`;
    chatEl.appendChild(details);
    reasonBox = {
      el: details,
      body: details.querySelector(".reason-body"),
      summary: details.querySelector("summary"),
      finish() {
        details.classList.remove("thinking");
        this.summary.textContent = "思考过程（点开看）";
      }
    };
  }
  const tempMsg = { role: "assistant", content: "", uid: newUid() };
  const aiBlock = buildBlock(tempMsg);
  const aiDiv = aiBlock.querySelector(".msg");
  const actionsRow = aiBlock.querySelector(".actions");
  actionsRow.style.display = "none";
  aiDiv.innerHTML = '<span class="loading"><span></span><span></span><span></span></span>';
  chatEl.appendChild(aiBlock);
  scrollToBottom();
  let fullText = "";
  let reasonText = "";
  let hasReasonContent = false;
  let firstChunk = true;
  let usage = null;
  abortController = new AbortController();
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + key
      },
      body: JSON.stringify({
        model: model,
        messages: trimmed,
        stream: true,
        temperature: 1.0,
        stream_options: { include_usage: true }
      }),
      signal: abortController.signal
    });
    if (!res.ok) {
      const errText = await res.text();
      aiDiv.classList.add("error");
      aiDiv.textContent = `请求失败 (${res.status})：\n${errText}`;
      if (reasonBox) reasonBox.el.remove();
      isStreaming = false;
      sendBtn.disabled = false;
      return;
    }
    const reader  = res.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buffer = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) {
        const l = line.trim();
        if (!l || !l.startsWith("data:")) continue;
        const payload = l.slice(5).trim();
        if (payload === "[DONE]") continue;
        try {
          const json = JSON.parse(payload);
          if (json.usage) usage = json.usage;
          const deltaObj = json.choices?.[0]?.delta || {};
          const rDelta = deltaObj.reasoning_content;
          if (rDelta && reasonBox) {
            hasReasonContent = true;
            reasonText += rDelta;
            reasonBox.body.textContent = reasonText;
            reasonBox.body.scrollTop = reasonBox.body.scrollHeight;
            scrollToBottom();
          }
          const delta = deltaObj.content;
          if (delta) {
            if (firstChunk) {
              aiDiv.textContent = "";
              aiDiv.classList.add("cursor");
              firstChunk = false;
            }
            fullText += delta;
            aiDiv.innerHTML = renderMarkdown(fullText) + '<span style="color:var(--primary)">▋</span>';
            scrollToBottom();
          }
        } catch (e) {}
      }
    }
    aiDiv.classList.remove("cursor");
    if (reasonBox) {
      if (hasReasonContent) { reasonBox.finish(); reasonBox.el.open = false; }
      else { reasonBox.el.remove(); reasonBox = null; }
    }
    let curTokens = 0, curCost = 0;
    if (usage) {
      curTokens = usage.total_tokens || 0;
      curCost = calcCost(usage, model);
      stat.totalTokens += curTokens;
      stat.totalCost += curCost;
      stat.reqCount += 1;
      saveStat();
      updateStatUI(curTokens);
    } else {
      curTokens = Math.round((text.length + fullText.length) * 0.6);
      updateStatUI(curTokens);
    }
    if (fullText) {
      const finalMsg = {
        role: "assistant", content: fullText,
        uid: tempMsg.uid,
        chars: fullText.length,
        tokens: curTokens,
        cost: curCost
      };
      if (reasonText) finalMsg.reasoning = reasonText;
      const lastUser = [...messages].reverse().find(m => m.role === "user");
      if (lastUser) finalMsg.parentUid = lastUser.uid;
      messages.push(finalMsg);
      aiBlock.replaceWith(buildBlock(finalMsg));
      saveMessagesForCur();
    } else if (!hasReasonContent) {
      aiDiv.textContent = "（无响应内容）";
      actionsRow.style.display = "";
    } else aiBlock.remove();
  } catch (e) {
    aiDiv.classList.remove("cursor");
    if (reasonBox) reasonBox.el.remove();
    if (e.name === "AbortError") {
      if (fullText) {
        const finalMsg = {
          role: "assistant", content: fullText,
          uid: tempMsg.uid,
          chars: fullText.length, tokens: 0, cost: 0
        };
        if (reasonText) finalMsg.reasoning = reasonText;
        messages.push(finalMsg);
        aiBlock.replaceWith(buildBlock(finalMsg));
        saveMessagesForCur();
      } else aiBlock.remove();
    } else {
      aiDiv.classList.add("error");
      aiDiv.textContent = "网络错误：" + e.message;
      actionsRow.style.display = "";
    }
  } finally {
    isStreaming = false;
    sendBtn.disabled = false;
    abortController = null;
    scrollToBottom();
  }
}
